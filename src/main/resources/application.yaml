spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:3000,http://localhost:8080}
                allowedHeaders: "*"
                allowedMethods: "*"
                allowCredentials: true
          default-filters:
            - RemoveRequestHeader=id-account
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          routes:
            - id: account-service
              uri: http://account:8080
              predicates:
                - Path=/accounts/**
            
            - id: auth-service
              uri: http://auth:8080
              predicates:
                - Path=/auth/**

            - id: exchange-service
              uri: http://exchange:8080
              predicates:
                - Path=/exchanges/**

logging:
  level:
    root: info
    store: ${LOG_LEVEL_STORE:info}